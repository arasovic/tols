<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b0b0b"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- x is 602, not 600: text-anchor="middle" counts the trailing letter-spacing,
       which pulls the visible ink half a space (2px) to the left. -->
  <text x="602" y="333" text-anchor="middle"
        font-family="'Martian Mono Cn', ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="168" font-weight="700" letter-spacing="4" fill="#f2f2f2">tols</text>

  <text x="600" y="417" text-anchor="middle"
        font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="40" fill="#ffb000">$ npm i -g tols</text>
</svg>
