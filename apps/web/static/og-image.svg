<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Logo mark -->
  <rect x="100" y="150" width="84" height="84" rx="18" fill="url(#mark)"/>
  <text x="142" y="207" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">{}</text>

  <!-- Title -->
  <text x="208" y="210" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#fafafa" letter-spacing="-1">DevUtils</text>

  <!-- Tagline -->
  <text x="102" y="322" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" fill="#a1a1aa">Essential tools for every developer — free, fast, private.</text>

  <!-- Tool chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22">
    <rect x="100" y="380" width="130" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="165" y="413" fill="#d4d4d8" text-anchor="middle">JSON</text>

    <rect x="250" y="380" width="150" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="325" y="413" fill="#d4d4d8" text-anchor="middle">Base64</text>

    <rect x="420" y="380" width="130" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="485" y="413" fill="#d4d4d8" text-anchor="middle">UUID</text>

    <rect x="570" y="380" width="130" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="635" y="413" fill="#d4d4d8" text-anchor="middle">Hash</text>

    <rect x="720" y="380" width="130" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="785" y="413" fill="#d4d4d8" text-anchor="middle">JWT</text>

    <rect x="870" y="380" width="190" height="52" rx="26" fill="#18181b" stroke="#3f3f46"/>
    <text x="965" y="413" fill="#d4d4d8" text-anchor="middle">+25 more</text>
  </g>

  <!-- Privacy strip -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24">
    <circle cx="112" cy="520" r="6" fill="#22c55e"/>
    <text x="132" y="528" fill="#a1a1aa">No server</text>
    <circle cx="312" cy="520" r="6" fill="#22c55e"/>
    <text x="332" y="528" fill="#a1a1aa">No cookies</text>
    <circle cx="532" cy="520" r="6" fill="#8b5cf6"/>
    <text x="552" y="528" fill="#a1a1aa">100% browser-based</text>
  </g>
</svg>
