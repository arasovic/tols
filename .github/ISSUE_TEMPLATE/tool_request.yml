name: New tool
description: Suggest a tool that does not exist yet
labels: [enhancement]
body:
  - type: input
    id: tool
    attributes:
      label: What tool
    validations:
      required: true

  - type: textarea
    id: use
    attributes:
      label: What you would use it for
      description: >
        A concrete case is more useful than a category. It decides what the
        default behaviour should be.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What goes in and what comes out
      description: >
        Both sides matter, because every tool here ships as a web page and as a
        CLI command that pipes.
      render: text

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can work without a backend, entirely in the browser
        - label: This can work without adding a runtime dependency
