name: Bug report
description: Something produces the wrong result, or does not work
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Website
        - CLI
        - Both
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: JSON Formatter, or tols json fmt
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input
      description: >
        The smallest input that shows the problem. Please remove anything
        private first: the tools handle tokens and passwords, and an issue is
        public.
      render: text
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: For the CLI, `tols --version`. For the site, your browser.
