version: 2

# Each ecosystem groups every update into a single pull request. This is a small
# repository reviewed in batches, so one branch per week per ecosystem is the
# reviewable unit; one branch per dependency is not. Security updates are not
# grouped and still arrive on their own branch, which is the point of them.
updates:
  # The package currently declares no dependencies. The entry stays so the first
  # one added is covered without anyone remembering to come back here.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
