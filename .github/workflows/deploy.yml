name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-run. A push event dropped during a GitHub incident never comes
  # back, and without this trigger the only way to redeploy the same commit is
  # an empty commit. `gh workflow run deploy.yml` instead.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26. Node 24 also
          # matches release.yml and ships npm >= 11.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Guards that read build/. Kept out of `npm test` so the normal suite
      # never depends on a build, which is why they have to be run explicitly
      # here — and why they fail rather than skip when build/ is missing.
      - run: npm run test:built
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
