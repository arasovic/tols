name: Pull Request Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload CLI coverage
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage/cli/lcov.info
          flags: cli
          name: cli
          root_dir: packages/tols
          network_prefix: packages/tols/
      - name: Upload web coverage
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage/web/lcov.info
          flags: web
          name: web
          root_dir: apps/web
          network_prefix: apps/web/
      - run: npm run check
      - run: npm run build
      - run: npm run test:built
